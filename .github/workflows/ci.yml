name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libgtest-dev

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFALCON_MARCH_NATIVE=OFF
          -DFALCON_WERROR=ON
          -DFALCON_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Install (staging)
        run: cmake --install build --prefix staging

      - name: Verify package
        run: |
          echo "=== Headers ===" && find staging/include -name '*.h' && echo
          echo "=== Libraries ===" && find staging/lib -type f && echo
          echo "=== Binaries ===" && ls staging/bin && echo
          echo "=== Config template ===" && ls staging/share/falcon/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: falcon-gateway-linux-x64
          path: staging/
          retention-days: 7

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libgtest-dev

      # TSan needs a smaller mmap randomization range on recent kernels
      - name: Configure kernel for TSan
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DFALCON_BUILD_TESTS=ON
          -DFALCON_WERROR=ON
          -DFALCON_SANITIZER=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build -j$(nproc) --target falcon_tests

      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure
